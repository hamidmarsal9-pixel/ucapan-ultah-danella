<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #ff9a9e, #fecfef); text-align: center; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 400px; width: 85%; }
        h1 { color: #ff4d6d; font-size: 24px; }
        p { font-size: 16px; line-height: 1.5; color: #333; }
        button { background-color: #ff4d6d; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 25px; cursor: pointer; margin-top: 15px; }
        .hidden { display: none; }
        .emoji { font-size: 40px; }
    </style>
</head>
<body>
    <div class="card" id="hal1">
        <div class="emoji">🎈🎂🎁</div>
        <h1>Hai Danellaa!</h1>
        <p>maaf yee buat kau sedih teyuss</p>
        <button onclick="pindah()">Buka Pesan</button>
    </div>
    <div class="card hidden" id="hal2">
        <div class="emoji">💖✨🎉</div>
        <h1>Selamat Ultah ke-14 Tahun!</h1>
        <p>semoga suksess bee dan doake aku sukses jugo ee</p>
        <button onclick="alert('Makasih lah baca! Hubungi aku sekarang ya! 🤍')">Klik Ini Sayang 🤍</button>
    </div>
    <script>
        function pindah() {
            document.getElementById('hal1').classList.add('hidden');
            document.getElementById('hal2').classList.remove('hidden');
        }
    </script>
</body>
</html>
